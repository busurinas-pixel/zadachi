<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачи · Kanban (команда)</title>
<style>
  :root{
    --bg:#f2ebdd; --card:#fffdf7; --card-2:#f8f1e3; --text:#2c2822; --muted:#8a8073;
    --border:#e6dcc9; --border-soft:#efe7d6; --primary:#4a4034; --primary-soft:#efe6d3;
    --shadow:0 1px 2px rgba(74,64,52,.06),0 1px 3px rgba(74,64,52,.05);
    --shadow-lg:0 8px 24px rgba(74,64,52,.14);
    --slate:#8a8073; --slate-bg:#efe8dc; --blue:#2f6fb0; --blue-bg:#eaf1f8;
    --amber:#c07d1a; --amber-bg:#fbf3e2; --emerald:#3f8f5f; --emerald-bg:#eaf5ec;
    --red:#c0392b; --orange:#cf6a2b; --yellow:#b8860b; --green:#4a9d6a; --purple:#8a6db0;
  }
  :root[data-theme="dark"]{
    --bg:#0b1020; --card:#151b2c; --card-2:#111726; --text:#e7eaf0; --muted:#93a0b5;
    --border:#242c40; --border-soft:#1c2333; --primary:#5b8def; --primary-soft:#1a2440;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
    --slate:#94a3b8; --slate-bg:#1e293b; --blue:#60a5fa; --blue-bg:#12233f;
    --amber:#fbbf24; --amber-bg:#2a2410; --emerald:#34d399; --emerald-bg:#0f2a20;
    --red:#f87171; --orange:#fb923c; --yellow:#facc15; --green:#34d399; --purple:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
  .app{display:flex;flex-direction:column;height:100vh}
  header.topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
  header.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  header.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
  .spacer{flex:1}
  .me-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:flex;align-items:center;gap:8px}
  .me-btn b{color:var(--text)}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:.15s}
  .icon-btn:hover{background:var(--bg);color:var(--text)}
  .body{display:flex;flex:1;min-height:0}
  aside.side{width:250px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);padding:16px 12px;overflow-y:auto}
  aside.side .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 10px 8px;display:flex;justify-content:space-between;align-items:center}
  aside.side .lbl:first-child{padding-top:2px}
  .add-mini{color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
  .add-mini:hover{color:var(--primary)}
  .row-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.12s;font-size:13.5px}
  .row-item:hover{background:var(--bg)}
  .row-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .row-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .row-item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-item .cnt{font-size:11px;color:var(--muted);background:var(--bg);padding:1px 7px;border-radius:20px;font-weight:600}
  .row-item.active .cnt{background:var(--card)}
  .avatar{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  main.board{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 20px 0}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;flex-shrink:0}
  .search{position:relative;flex:1;min-width:170px;max-width:360px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;height:40px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);outline:none;transition:.15s}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  select.filter{height:40px;padding:0 30px 0 12px;border:1px solid var(--border);border-radius:11px;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 9px center;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
  .archive-toggle{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:11px;background:var(--card);font-size:13px;color:var(--muted)}
  .switch{position:relative;width:36px;height:20px;border-radius:20px;background:var(--border);transition:.2s;flex-shrink:0;cursor:pointer}
  .switch.on{background:var(--primary)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switch.on::after{left:18px}
  .btn-primary{height:40px;padding:0 16px;border-radius:11px;background:var(--primary);color:#fff;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);transition:.15s}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:var(--shadow-lg)}
  .columns{display:flex;gap:16px;flex:1;overflow-x:auto;overflow-y:hidden;padding-bottom:18px}
  .col{flex-shrink:0;width:300px;display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--border);background:var(--card-2);transition:.15s}
  .col.dragover{box-shadow:0 0 0 2px var(--primary);transform:scale(1.01)}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);border-radius:16px 16px 0 0}
  .col-head .l{display:flex;align-items:center;gap:10px}
  .col-head .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .col-head .t{font-weight:600;font-size:13.5px}
  .col-head .badge{font-weight:700;font-size:12px;min-width:26px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1px 7px}
  .col.new .ic{background:var(--slate-bg);color:var(--slate)} .col.backlog .ic{background:var(--primary-soft);color:var(--primary)} .col.progress .ic{background:var(--blue-bg);color:var(--blue)}
  .col.approval .ic{background:var(--amber-bg);color:var(--amber)} .col.done .ic{background:var(--emerald-bg);color:var(--emerald)}
  .col-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px;min-height:120px}
  .card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--slate);border-radius:12px;padding:12px;cursor:grab;transition:transform .12s,box-shadow .12s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4}
  .card.p-urgent{border-left-color:var(--red)} .card.p-high{border-left-color:var(--orange)}
  .card.p-medium{border-left-color:var(--yellow)} .card.p-low{border-left-color:var(--green)}
  .card.is-done{opacity:.62}
  .card.src-crm{background:linear-gradient(0deg,var(--blue-bg),var(--blue-bg)),var(--card)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .src-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:7px}
  .src-badge.crm{background:var(--blue-bg);color:var(--blue)} .src-badge.mentor{background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple)} .src-badge.self{background:var(--slate-bg);color:var(--slate)}
  .prio-ic{display:flex;align-items:center}
  .prio-ic.urgent{color:var(--red)} .prio-ic.high{color:var(--orange)} .prio-ic.medium{color:var(--yellow)} .prio-ic.low{color:var(--green)}
  .card h4{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
  .card.is-done h4{text-decoration:line-through;color:var(--muted)}
  .card .proj{display:flex;align-items:center;gap:6px;margin-top:8px}
  .card .proj .dot{width:8px;height:8px;border-radius:50%}
  .card .proj span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-bot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
  .deadline{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
  .deadline.overdue{color:var(--red);font-weight:600} .deadline.today{color:var(--amber);font-weight:600}
  .meta{display:flex;align-items:center;gap:9px;margin-left:auto}
  .meta span{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
  .assignee-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px}
  .assignee-chip .avatar{width:18px;height:18px;font-size:9px}
  .assignee-chip span{font-size:12px;color:var(--muted)}
  .empty-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 0;color:var(--muted)}
  .empty-col .circ{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .empty-col span{font-size:12px}
  /* dialogs */
  .overlay{position:fixed;inset:0;background:rgba(8,12,24,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .dialog{width:100%;max-width:560px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
  .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--card);z-index:2}
  .dialog-head h3{font-size:16px;font-weight:700}
  .dialog-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field textarea{resize:vertical;min-height:60px}
  .field select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:30px;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sect{border-top:1px solid var(--border-soft);padding-top:14px}
  .sect h5{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .sub-row{display:flex;align-items:center;gap:9px;padding:6px 0}
  .sub-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent}
  .sub-check.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .sub-row .st{flex:1;font-size:13.5px}
  .sub-row.done .st{text-decoration:line-through;color:var(--muted)}
  .sub-row .who{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:20px}
  .sub-del{color:var(--muted);opacity:0;cursor:pointer}
  .sub-row:hover .sub-del{opacity:1}
  .inline-add{display:flex;gap:8px;margin-top:8px}
  .inline-add input,.inline-add select{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);outline:none}
  .inline-add input{flex:1}
  .inline-add button{padding:0 14px;border-radius:9px;background:var(--primary-soft);color:var(--primary);font-weight:600}
  .att-list{display:flex;flex-direction:column;gap:9px}
  .att{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
  .att .ic{color:var(--muted);flex-shrink:0}
  .att .nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att a{color:var(--primary);text-decoration:none;font-size:12.5px}
  .att audio{height:34px}
  .att img{max-width:90px;max-height:60px;border-radius:6px;object-fit:cover}
  .att .del{color:var(--muted);cursor:pointer}
  .att .del:hover{color:var(--red)}
  .att-btns{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
  .att-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:500;transition:.15s}
  .att-btn:hover{background:var(--bg)}
  .att-btn.rec{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
  .att-btn.recording{background:color-mix(in srgb,var(--red) 12%,transparent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .cmt{display:flex;flex-direction:column;gap:2px;padding:9px 11px;background:var(--bg);border-radius:10px}
  .cmt .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .cmt .h b{color:var(--text)}
  .cmt .b{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
  .dialog-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-top:1px solid var(--border-soft);position:sticky;bottom:0;background:var(--card)}
  .btn-ghost{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
  .btn-ghost:hover{background:var(--bg);color:var(--text)}
  .btn-danger{color:var(--red)} .btn-danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 18px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .setup{max-width:620px;margin:60px auto;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:16px}
  .setup h2{font-size:19px;margin-bottom:10px}
  .setup p,.setup li{color:var(--muted);margin-bottom:8px}
  .setup code{background:var(--bg);padding:2px 6px;border-radius:5px;color:var(--text);font-size:12.5px}
  .setup ol{padding-left:20px}
  @media(max-width:900px){aside.side{display:none}header.topbar{padding:12px 14px}main.board{padding:12px 12px 0}}
  /* password gate */
  .gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:9999;
    background:radial-gradient(1200px 600px at 50% -10%,#fbf6ea,#f2ebdd 60%,#ece2cf)}
  .gate-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;
    box-shadow:0 20px 60px rgba(74,64,52,.16);padding:34px 30px;text-align:center}
  .gate-logo{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--text)}
  .gate-sub{color:var(--muted);font-size:13.5px;margin-top:6px;margin-bottom:22px}
  .gate-card input{width:100%;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:12px;
    background:var(--bg);color:var(--text);outline:none;font-size:15px;text-align:center;transition:.15s}
  .gate-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .gate-err{display:none;color:var(--red);font-size:13px;margin-top:10px}
  .gate-btn{width:100%;height:46px;margin-top:16px;border-radius:12px;background:var(--primary);color:#fff;
    font-weight:600;font-size:15px;transition:.15s}
  .gate-btn:hover{filter:brightness(1.08)}
  /* Цветная светлая тема — палитра как в ПЛАНИРОВЩИК.html Софии */
  :root:not([data-theme="dark"]){
    --bg:#fdf6f3; --card:#ffffff; --card-2:#fffaf8; --text:#4a3a40; --muted:#9a8288;
    --border:#ecd6d6; --border-soft:#f3e4e2; --primary:#b0476a; --primary-soft:#f3c6d0;
    --red:#d9485f; --orange:#e07a3f; --yellow:#d4a017; --green:#3f8a5a;
  }
  :root:not([data-theme="dark"]) body{background:linear-gradient(135deg,#fde7ec 0%,#fdf1e4 35%,#eef7ef 70%,#e8f0fa 100%) fixed}
  :root:not([data-theme="dark"]) header.topbar{background:linear-gradient(90deg,#f3c6d0,#fbd9c4 35%,#f7e7ae 65%,#cfe8d5);border-bottom:none}
  :root:not([data-theme="dark"]) aside.side{background:rgba(255,255,255,.72);backdrop-filter:blur(6px)}
  :root:not([data-theme="dark"]) main.board{background:transparent}
  :root:not([data-theme="dark"]) .col{border:none;box-shadow:0 2px 10px rgba(176,71,106,.08)}
  :root:not([data-theme="dark"]) .col.new{background:#e0d7f2} :root:not([data-theme="dark"]) .col.new .col-head{background:#cfc2ec}
  :root:not([data-theme="dark"]) .col.new .ic{background:#fff;color:#7458a8}
  :root:not([data-theme="dark"]) .col.backlog{background:#cfe1f1} :root:not([data-theme="dark"]) .col.backlog .col-head{background:#b7d2ea}
  :root:not([data-theme="dark"]) .col.backlog .ic{background:#fff;color:#3d6f9e}
  :root:not([data-theme="dark"]) .col.progress{background:#fbd9c4} :root:not([data-theme="dark"]) .col.progress .col-head{background:#f8c3a3}
  :root:not([data-theme="dark"]) .col.progress .ic{background:#fff;color:#c0602f}
  :root:not([data-theme="dark"]) .col.approval{background:#f7e7ae} :root:not([data-theme="dark"]) .col.approval .col-head{background:#f2d97f}
  :root:not([data-theme="dark"]) .col.approval .ic{background:#fff;color:#9a7a12}
  :root:not([data-theme="dark"]) .col.done{background:#cfe8d5} :root:not([data-theme="dark"]) .col.done .col-head{background:#b4dbbe}
  :root:not([data-theme="dark"]) .col.done .ic{background:#fff;color:#3f8a5a}
  :root:not([data-theme="dark"]) .col-head{border-bottom:none}
  :root:not([data-theme="dark"]) .col-head .badge{background:rgba(255,255,255,.8);border:none}
  :root:not([data-theme="dark"]) .empty-col{color:rgba(74,58,64,.55)}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-logo">Задачи команды</div>
    <div class="gate-sub">Вход</div>
    <input id="gateEmail" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:10px">
    <input id="gatePw" type="password" placeholder="Пароль" autocomplete="current-password">
    <div id="gateErr" class="gate-err">Неверный email или пароль</div>
    <button id="gateBtn" class="gate-btn">Войти</button>
  </div>
</div>
<div id="root"></div>

<div class="app" id="app" style="display:none">
  <header class="topbar">
    <div>
      <h1>Задачи команды</h1>
      <div class="sub">Общая доска · <span id="statusHint">подключение…</span></div>
    </div>
    <div class="spacer"></div>
    <button class="me-btn" id="meBtn">Вы: <b id="meName">—</b></button>
    <button class="icon-btn" id="themeBtn" title="Тема">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="logoutBtn" title="Выйти">

<script>
"use strict";
const cfg = window.KANBAN_CONFIG || {};
const BUCKET = 'task-media';

function showSetup(msg){
  document.getElementById('root').innerHTML = `<div class="setup">
    <h2>Нужно подключить базу</h2>
    <p>${msg||''}</p>
    <ol>
      <li>Создай бесплатный проект на <code>supabase.com</code>.</li>
      <li>Открой <b>SQL Editor</b> → вставь и запусти файл <code>schema.sql</code>.</li>
      <li>Скопируй <code>config.example.js</code> в <code>config.js</code> и впиши <b>Project URL</b> и <b>anon key</b> (Project Settings → API).</li>
      <li>Обнови эту страницу.</li>
    </ol>
    <p>Подробно — в <code>README.md</code>.</p>
  </div>`;
}
if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.includes('ВАШ')){
  showSetup('Файл <code>config.js</code> не заполнен.');
  throw new Error('config missing');
}
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

/* ---------- icons ---------- */
const ICON = {
  urgent:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>',
  high:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  medium:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  low:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  cal:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  crm:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>',
  user:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0112 0v1"/></svg>',
  spark:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  msg:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  paper:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3 3 0 014.24 4.24l-9.2 9.19a1 1 0 01-1.41-1.41l8.49-8.49"/></svg>',
  mic:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/></svg>',
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>',
  clip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>',
  done:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>',
  stack:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg>',
  file:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>',
};
const COLUMNS=[
  {status:'new',title:'Новые',cls:'new',icon:ICON.clock},
  {status:'backlog',title:'Бэклог',cls:'backlog',icon:ICON.stack},
  {status:'in_progress',title:'В работе',cls:'progress',icon:ICON.play},
  {status:'pending_approval',title:'На рассмотрении',cls:'approval',icon:ICON.clip},
  {status:'done',title:'Готово',cls:'done',icon:ICON.done},
];
const SRC={crm:{cls:'crm',ic:ICON.crm,label:'CRM'},mentor:{cls:'mentor',ic:ICON.user,label:'Наставник'},self:{cls:'self',ic:ICON.spark,label:'Моя'}};
const PROJ_COLORS=['#2A6FE3','#7c3aed','#059669','#ea580c','#dc2626','#0891b2','#c026d3','#65a30d'];

/* ---------- state ---------- */
let D={tasks:[],projects:[],members:[],sub:[],cmt:[],att:[]};
let filters={q:'',source:'all',prio:'all',project:null,archived:false};
let editingId=null;
let meName=localStorage.getItem('kanban.me')||'';

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function initials(n){return (n||'?').trim().slice(0,1).toUpperCase();}
function memberName(id){const m=D.members.find(x=>x.id===id);return m?m.name:null;}
function projName(id){const p=D.projects.find(x=>x.id===id);return p?p.name:null;}
function projColor(id){const p=D.projects.find(x=>x.id===id);return p?p.color:'#888';}

/* ---------- load ---------- */
async function loadAll(){
  try{
    const [pr,me,ts,su,cm,at]=await Promise.all([
      sb.from('projects').select('*').order('created_at'),
      sb.from('members').select('*').order('created_at'),
      sb.from('tasks').select('*').order('created_at',{ascending:false}),
      sb.from('subtasks').select('id,task_id,done'),
      sb.from('comments').select('id,task_id'),
      sb.from('attachments').select('id,task_id,kind'),
    ]);
    for(const r of [pr,me,ts,su,cm,at]) if(r.error) throw r.error;
    D.projects=pr.data; D.members=me.data; D.tasks=ts.data; D.sub=su.data; D.cmt=cm.data; D.att=at.data;
    document.getElementById('statusHint').textContent='на связи';
    render();
  }catch(e){
    document.getElementById('statusHint').textContent='ошибка подключения';
    toast('Ошибка базы: '+(e.message||e));
    console.error(e);
  }
}

/* ---------- date ---------- */
function fmtDeadline(iso){
  if(!iso)return null;
  const t=new Date(iso+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);
  const diff=Math.round((t-now)/86400000);
  if(diff===0)return{label:'Сегодня',state:'today'};
  if(diff===1)return{label:'Завтра',state:''};
  if(diff<0)return{label:t.toLocaleDateString('ru',{day:'numeric',month:'short'}),state:'overdue'};
  return{label:t.toLocaleDateString('ru',{day:'numeric',month:'short'}),state:''};
}
function fmtTime(iso){const d=new Date(iso);return d.toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}

/* ---------- render sidebar ---------- */
function render(){
  renderSide(); renderBoard(); document.getElementById('meName').textContent=meName||'аноним';
}
function renderSide(){
  const active=filters.project;
  const countAll=D.tasks.filter(t=>!t.archived&&t.status!=='done').length;
  let h=`<div class="row-item ${active===null?'active':''}" data-proj="">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
    <span class="name">Все задачи</span><span class="cnt">${countAll}</span></div>`;
  D.projects.forEach(p=>{
    const c=D.tasks.filter(t=>t.project_id===p.id&&!t.archived&&t.status!=='done').length;
    h+=`<div class="row-item ${active===p.id?'active':''}" data-proj="${p.id}"><span class="dot" style="background:${p.color}"></span><span class="name">${esc(p.name)}</span><span class="cnt">${c}</span></div>`;
  });
  document.getElementById('projList').innerHTML=h;
  document.querySelectorAll('#projList .row-item').forEach(it=>it.onclick=()=>{filters.project=it.dataset.proj||null;render();});

  document.getElementById('memberList').innerHTML=D.members.map(m=>{
    const c=D.tasks.filter(t=>t.assignee_id===m.id&&!t.archived&&t.status!=='done').length;
    return `<div class="row-item" data-member="${m.id}"><span class="avatar">${initials(m.name)}</span><span class="name">${esc(m.name)}</span><span class="cnt">${c}</span></div>`;
  }).join('')||'<div style="padding:6px 10px;color:var(--muted);font-size:12px">Пока никого</div>';
}

/* ---------- render board ---------- */
function subCount(id){const s=D.sub.filter(x=>x.task_id===id);return{total:s.length,done:s.filter(x=>x.done).length};}
function cmtCount(id){return D.cmt.filter(x=>x.task_id===id).length;}
function attCount(id){const a=D.att.filter(x=>x.task_id===id);return{total:a.length,voice:a.filter(x=>x.kind==='voice').length};}

function visible(){
  return D.tasks.filter(t=>{
    if(!!t.archived!==filters.archived)return false;
    if(filters.project&&t.project_id!==filters.project)return false;
    if(filters.source!=='all'&&t.source!==filters.source)return false;
    if(filters.prio!=='all'&&t.priority!==filters.prio)return false;
    if(filters.q&&!t.title.toLowerCase().includes(filters.q.toLowerCase()))return false;
    return true;
  });
}
function cardHTML(t){
  const s=SRC[t.source]||SRC.self, isDone=t.status==='done', dl=fmtDeadline(t.deadline), pn=projName(t.project_id);
  const sc=subCount(t.id), cc=cmtCount(t.id), ac=attCount(t.id), an=memberName(t.assignee_id);
  let meta='';
  if(sc.total)meta+=`<span>${ICON.check}${sc.done}/${sc.total}</span>`;
  if(ac.voice)meta+=`<span>${ICON.mic}${ac.voice}</span>`;
  if(ac.total-ac.voice>0)meta+=`<span>${ICON.paper}${ac.total-ac.voice}</span>`;
  if(cc)meta+=`<span>${ICON.msg}${cc}</span>`;
  return `<div class="card p-${t.priority} src-${t.source} ${isDone?'is-done':''}" draggable="true" data-id="${t.id}">
    <div class="card-top"><span class="src-badge ${s.cls}">${s.ic}${s.label}</span><span class="prio-ic ${t.priority}">${ICON[t.priority]}</span></div>
    <h4>${esc(t.title)}</h4>
    ${pn?`<div class="proj"><span class="dot" style="background:${projColor(t.project_id)}"></span><span>${esc(pn)}</span></div>`:''}
    ${an?`<div class="assignee-chip"><span class="avatar">${initials(an)}</span><span>${esc(an)}</span></div>`:''}
    <div class="card-bot">${dl?`<span class="deadline ${dl.state}">${ICON.cal}${dl.label}</span>`:'<span></span>'}<span class="meta">${meta}</span></div>
  </div>`;
}
function renderBoard(){
  const vis=visible();
  document.getElementById('columns').innerHTML=COLUMNS.map(col=>{
    const list=vis.filter(t=>t.status===col.status);
    const body=list.length?list.map(cardHTML).join(''):`<div class="empty-col"><div class="circ">${ICON.check}</div><span>Нет задач</span></div>`;
    return `<div class="col ${col.cls}" data-status="${col.status}"><div class="col-head"><div class="l"><div class="ic">${col.icon}</div><div class="t">${col.title}</div></div><div class="badge">${list.length}</div></div><div class="col-body">${body}</div></div>`;
  }).join('');
  wireCards(); wireColumns();
}

/* ---------- drag ---------- */
let dragId=null;
function wireCards(){
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');});
    c.addEventListener('click',()=>openDialog(c.dataset.id));
  });
}
function wireColumns(){
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover');});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('dragover');});
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('dragover');
      if(!dragId)return;
      const t=D.tasks.find(x=>x.id===dragId);
      if(t&&t.status!==col.dataset.status){
        t.status=col.dataset.status; renderBoard();
        const {error}=await sb.from('tasks').update({status:t.status,updated_at:new Date().toISOString()}).eq('id',t.id);
        if(error)toast('Не сохранилось: '+error.message);
      }
    });
  });
}

/* ---------- selects ---------- */
function fillSelect(el,items,val,placeholder){
  el.innerHTML=(placeholder?`<option value="">${placeholder}</option>`:'')+items.map(i=>`<option value="${i.id}" ${val===i.id?'selected':''}>${esc(i.name)}</option>`).join('');
}

/* ---------- dialog ---------- */
function openDialog(id){
  editingId=id||null;
  const t=id?D.tasks.find(x=>x.id===id):null;
  document.getElementById('dlgTitle').textContent=t?'Задача':'Новая задача';
  document.getElementById('fTitle').value=t?t.title:'';
  document.getElementById('fDesc').value=t?(t.description||''):'';
  document.getElementById('fPrio').value=t?t.priority:'medium';
  document.getElementById('fSource').value=t?t.source:'self';
  document.getElementById('fStatus').value=t?t.status:'new';
  document.getElementById('fDeadline').value=t?(t.deadline||''):'';
  fillSelect(document.getElementById('fProject'),D.projects,t?t.project_id:(filters.project||''),'Без проекта');
  fillSelect(document.getElementById('fAssignee'),D.members,t?t.assignee_id:'','Не назначен');
  fillSelect(document.getElementById('subAssignee'),D.members,'','Кому');
  document.getElementById('dlgDelete').style.visibility=t?'visible':'hidden';
  ['sectSub','sectAtt','sectCmt'].forEach(s=>document.getElementById(s).style.display=t?'block':'none');
  if(t)renderDetail(t.id);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('fTitle').focus();
}
function closeDialog(){document.getElementById('overlay').classList.remove('show');editingId=null;stopRecordingIfAny();}

async function saveDialog(){
  const title=document.getElementById('fTitle').value.trim();
  if(!title){document.getElementById('fTitle').focus();return;}
  const data={
    title, description:document.getElementById('fDesc').value.trim(),
    priority:document.getElementById('fPrio').value, source:document.getElementById('fSource').value,
    status:document.getElementById('fStatus').value, deadline:document.getElementById('fDeadline').value||null,
    project_id:document.getElementById('fProject').value||null, assignee_id:document.getElementById('fAssignee').value||null,
    updated_at:new Date().toISOString(),
  };
  if(editingId){const {error}=await sb.from('tasks').update(data).eq('id',editingId);if(error)return toast('Ошибка: '+error.message);}
  else{const {error}=await sb.from('tasks').insert(data);if(error)return toast('Ошибка: '+error.message);}
  closeDialog(); await loadAll();
}
async function deleteTask(){
  if(!editingId)return;
  if(!confirm('Удалить задачу со всеми подзадачами, комментариями и вложениями? Действие необратимо.'))return;
  const files=D.att.filter(a=>a.task_id===editingId);
  const paths=await sb.from('attachments').select('path').eq('task_id',editingId);
  if(paths.data&&paths.data.length)await sb.storage.from(BUCKET).remove(paths.data.map(x=>x.path));
  const {error}=await sb.from('tasks').delete().eq('id',editingId);
  if(error)return toast('Ошибка: '+error.message);
  closeDialog(); await loadAll();
}

/* ---------- detail sections (subtasks / attachments / comments) ---------- */
async function renderDetail(taskId){
  const [su,cm,at]=await Promise.all([
    sb.from('subtasks').select('*').eq('task_id',taskId).order('created_at'),
    sb.from('comments').select('*').eq('task_id',taskId).order('created_at'),
    sb.from('attachments').select('*').eq('task_id',taskId).order('created_at'),
  ]);
  // subtasks
  document.getElementById('subList').innerHTML=(su.data||[]).map(s=>{
    const who=memberName(s.assignee_id);
    return `<div class="sub-row ${s.done?'done':''}"><div class="sub-check ${s.done?'on':''}" data-sub="${s.id}" data-done="${s.done?1:0}">${ICON.check}</div><div class="st">${esc(s.title)}</div>${who?`<span class="who">${esc(who)}</span>`:''}<span class="sub-del" data-subdel="${s.id}">${ICON.trash}</span></div>`;
  }).join('')||'<div style="color:var(--muted);font-size:13px">Пока нет</div>';
  document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=async()=>{
    await sb.from('subtasks').update({done:el.dataset.done!=='1'}).eq('id',el.dataset.sub);
    renderDetail(taskId); softRefresh();
  });
  document.querySelectorAll('[data-subdel]').forEach(el=>el.onclick=async()=>{
    await sb.from('subtasks').delete().eq('id',el.dataset.subdel); renderDetail(taskId); softRefresh();
  });
  // attachments (приватный бакет — подписанные ссылки на 1 час)
  const attHtml=await Promise.all((at.data||[]).map(async a=>{
    const {data:su}=await sb.storage.from(BUCKET).createSignedUrl(a.path,3600);
    const url=su?su.signedUrl:'#';
    if(a.kind==='voice')return `<div class="att">${ICON.mic?'<span class="ic">'+ICON.mic+'</span>':''}<audio controls src="${url}" style="flex:1"></audio><span class="del" data-attdel="${a.id}" data-attpath="${esc(a.path)}">${ICON.trash}</span></div>`;
    if(a.kind==='image')return `<div class="att"><img src="${url}" alt=""><span class="nm">${esc(a.name||'')}</span><a href="${url}" target="_blank">открыть</a><span class="del" data-attdel="${a.id}" data-attpath="${esc(a.path)}">${ICON.trash}</span></div>`;
    return `<div class="att"><span class="ic">${ICON.file}</span><span class="nm">${esc(a.name||'файл')}</span><a href="${url}" target="_blank" download>скачать</a><span class="del" data-attdel="${a.id}" data-attpath="${esc(a.path)}">${ICON.trash}</span></div>`;
  }));
  document.getElementById('attList').innerHTML=attHtml.join('')||'<div style="color:var(--muted);font-size:13px">Пусто</div>';
  document.querySelectorAll('[data-attdel]').forEach(el=>el.onclick=async()=>{
    await sb.storage.from(BUCKET).remove([el.dataset.attpath]);
    await sb.from('attachments').delete().eq('id',el.dataset.attdel);
    renderDetail(taskId); softRefresh();
  });
  // comments
  document.getElementById('cmtList').innerHTML=(cm.data||[]).map(c=>
    `<div class="cmt"><div class="h"><b>${esc(c.author||'аноним')}</b><span>${fmtTime(c.created_at)}</span></div><div class="b">${esc(c.body)}</div></div>`
  ).join('')||'<div style="color:var(--muted);font-size:13px">Комментариев нет</div>';
}

async function addSubtask(){
  if(!editingId)return;
  const inp=document.getElementById('subInput'); const title=inp.value.trim(); if(!title)return;
  const assignee=document.getElementById('subAssignee').value||null;
  await sb.from('subtasks').insert({task_id:editingId,title,assignee_id:assignee});
  inp.value=''; renderDetail(editingId); softRefresh();
}
async function addComment(){
  if(!editingId)return;
  const inp=document.getElementById('cmtInput'); const body=inp.value.trim(); if(!body)return;
  await sb.from('comments').insert({task_id:editingId,body,author:meName||'аноним'});
  inp.value=''; renderDetail(editingId); softRefresh();
}

/* ---------- file upload ---------- */
async function uploadFiles(files){
  if(!editingId)return;
  for(const f of files){
    if(f.size>25*1024*1024){toast(`«${f.name}» больше 25 МБ — пропущен`);continue;}
    const ext=(f.name.split('.').pop()||'bin').toLowerCase();
    const path=`${editingId}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(error){toast('Не загрузилось: '+error.message);continue;}
    const kind=(f.type||'').startsWith('image/')?'image':'file';
    await sb.from('attachments').insert({task_id:editingId,kind,path,name:f.name});
  }
  renderDetail(editingId); softRefresh();
}

/* ---------- voice recording ---------- */
let mediaRec=null, chunks=[], recStart=0, recStream=null;
async function toggleRecord(){
  if(mediaRec&&mediaRec.state==='recording'){ mediaRec.stop(); return; }
  if(!editingId){toast('Сначала сохрани задачу');return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Браузер не поддерживает запись');return;}
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){toast('Нет доступа к микрофону');return;}
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
  mediaRec=new MediaRecorder(recStream,mime?{mimeType:mime}:undefined);
  chunks=[]; recStart=Date.now();
  mediaRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mediaRec.onstop=async()=>{
    const dur=Math.max(1,Math.round((Date.now()-recStart)/1000));
    const blob=new Blob(chunks,{type:mime||'audio/webm'});
    stopRecordingIfAny();
    setRecUI(false);
    const ext=(mime.includes('mp4'))?'m4a':'webm';
    const path=`${editingId}/voice-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type});
    if(error){toast('Голосовое не загрузилось: '+error.message);return;}
    await sb.from('attachments').insert({task_id:editingId,kind:'voice',path,name:'Голосовое',duration:dur});
    renderDetail(editingId); softRefresh(); toast('Голосовое добавлено');
  };
  mediaRec.start(); setRecUI(true);
}
function setRecUI(on){
  const b=document.getElementById('recBtn'); const l=document.getElementById('recLabel');
  b.classList.toggle('recording',on); l.textContent=on?'Остановить':'Записать голосовое';
}
function stopRecordingIfAny(){
  if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
  if(mediaRec&&mediaRec.state==='recording'){try{mediaRec.stop();}catch(e){}}
  mediaRec=null; setRecUI(false);
}

/* ---------- soft refresh of aggregates (for card badges) ---------- */
let refreshT=null;
function softRefresh(){clearTimeout(refreshT);refreshT=setTimeout(loadAll,400);}

document.getElementById('themeBtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');applyTheme(c==='dark'?'light':'dark');};

/* ---------- auth + boot ---------- */
let _started=false;
function startApp(){
  if(_started) return; _started=true;
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('meName').textContent=meName||'аноним';
  sb.channel('kanban-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},softRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'subtasks'},softRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},softRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'attachments'},softRefresh)
    .subscribe();
  loadAll();
}
function showLogin(){
  document.getElementById('app').style.display='none';
  const g=document.getElementById('gate'); g.style.display='flex';
  const em=document.getElementById('gateEmail'), pw=document.getElementById('gatePw'),
        err=document.getElementById('gateErr'), btn=document.getElementById('gateBtn');
  async function submit(){
    if(!em.value.trim()||!pw.value) return;
    err.style.display='none'; btn.disabled=true; btn.textContent='Вхожу…';
    const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    btn.disabled=false; btn.textContent='Войти';
    if(error){ const net=error.name==='AuthRetryableFetchError'||!error.status||/fetch|network|load failed/i.test(error.message||'');
      err.textContent=net?'Нет связи с базой. Проверьте интернет или включите/выключите VPN':'Неверный email или пароль'; err.style.display='block'; pw.value=''; pw.focus(); }
    else { startApp(); }
  }
  btn.onclick=submit;
  em.addEventListener('keydown',e=>{if(e.key==='Enter')pw.focus();});
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  em.focus();
}
async function logout(){ await sb.auth.signOut(); _started=false; location.reload(); }
document.getElementById('logoutBtn').onclick=logout;
(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) startApp(); else showLogin();
})();
</script>

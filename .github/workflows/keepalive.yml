# Раз в два дня заходит в базу доски, чтобы бесплатный Supabase не уснул от недели тишины.
name: keepalive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*SUPABASE_ANON_KEY: *"\([^"]*\)".*/\1/p' config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/projects?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $code"
          [ "$code" = "200" ]
